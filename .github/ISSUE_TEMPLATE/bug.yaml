name: 버그 리포트
description: 발견한 버그를 등록합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 순서를 적어 주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: 기타
      description: 스크린샷, 에러 로그, 실행 환경 등을 적어 주세요.
    validations:
      required: false
