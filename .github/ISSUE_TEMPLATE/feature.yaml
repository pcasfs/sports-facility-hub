name: 기능 개발
description: 새로운 기능 개발이나 개선 작업을 등록합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 개요
      description: 어떤 기능을 왜 만드는지 간단히 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 해야 할 작업을 체크리스트로 적어 주세요.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: 기타
      description: 참고 자료, 디자인 링크 등 추가로 공유할 내용을 적어 주세요.
    validations:
      required: false
